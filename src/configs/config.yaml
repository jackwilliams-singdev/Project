# Directory paths
INPUT_VIDEO: "/media/jackwilliams/external_01_cyclone_data/Videos/IMG_5098.mov"
OUTPUTS_DIR: "/media/jackwilliams/external_01_cyclone_data/sing-data"

# Pipeline settings
AUDIO_MODE: "filtered"
RUN_DENOISE: true

# Filter settings
AUDIO_SAMPLE_RATE: 48000
AUDIO_CHANNEL: "right"
HIGHPASS_FREQUENCY: 100
LOUDNESS_TARGET_I: -16
LOUDNESS_TARGET_TP: -1.5
LOUDNESS_TARGET_LRA: 11

# noise-reduce settings
DENOISE_STATIONARY: false 
DENOISE_PROP_DECREASE: 0.8

# Transcription settings
TRANSCRIPTION_ENGINE: "parakeet"
PARAKEET_MODEL: "nemo-parakeet-tdt-0.6b-v3"

# Analysis settings
GEMINI_MODEL: "gemini-3.5-flash-lite"
PROMPT_NAME: "prompt1.txt"
MACHINE_STATES: "Roping, Flaring, Transition, Blocked, Choking"


